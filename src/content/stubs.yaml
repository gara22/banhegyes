hivatal:
  paragraphs:
    - "A hivatal a község szíve, vagy legalábbis egy fontos belső szerve. Munkatársai a nap nagy részében dolgoznak, a maradék időben pedig készülnek."
    - "A hivatal épülete a főtér mellett áll, ahová a bejáratot szándékosan úgy tervezték, hogy az ügyfél mindig a hátsó ajtón érkezzen."
hivatal/nyilvantartasok:
  paragraphs:
    - "A hivatal különféle nyilvántartásokat vezet. A legfontosabb a nyilvántartások nyilvántartása, amelyet évente egyszer ellenőriznek."
    - "A nyilvántartások nyilvánosak, de a nyilvánosság jellemzően nem érdeklődik irántuk."
hivatal/nyilvantartasok/kereskedelem:
  paragraphs:
    - "A kereskedelmi nyilvántartásban azok a boltok, piaci standok és talicskák szerepelnek, amelyek legalább egyszer eladtak valamit."
    - "Új tétel felvételéhez elegendő egy paprika és egy határozott fellépés."
karrierm:
  paragraphs:
    - "A KarrierM program (paródia) célja, hogy a község lakói „megtalálják a helyüket”. A helyek egyelőre készletről vannak, a lakók viszont mozgásban."
    - "A program keretében tanácsadás, motivációs beszélgetés és egy ingyenes toll jár minden résztvevőnek."
kepviselo-testulet-valasztasanak-eredmenyei:
  paragraphs:
    - "Ez az oldal kitalált, és nem tartalmaz valódi választási eredményeket. A képviselő-testület tagjai a paródia világában a helyi paprika-szépségverseny után kerültek kiválasztásra."
    - "Valódi választási információkért kérjük, forduljon a hivatalos forrásokhoz."
kozerdeku-adatok:
  paragraphs:
    - "A közérdekű adatok a község működésének átláthatóságát szolgálják. Az átláthatóság foka a nap szakaszától és a hivatal ablakainak tisztaságától függ."
kozerdeku-adatok/tevekenyseg-mukodes:
  paragraphs:
    - "A hivatal tevékenysége három fő területre oszlik: tevékenykedés, működés és a kettő közötti bólogatás."
    - "A működési rend szerint a hivatal minden reggel kinyit, és minden este ugyanabban az állapotban zár."
kozerdeku-adatok/gazdalkodasi-adatok:
  paragraphs:
    - "A község költségvetése kitalált. Bevételi oldalon a legnagyobb tétel a szorgalom, kiadási oldalon a papírfelhasználás."
    - "A hivatal egyetlen forintot sem költött el, mert nincs forintja. Ezt a tényt a számvevők szerint „mindenki méltányolja”."
kozerdeku-adatok/palyazatok:
  paragraphs:
    - "A hivatal pályázatai kizárólag a képzelet területén valósulnak meg, de ott időben és költségkereten belül."
kozerdeku-adatok/uvegzseb:
  paragraphs:
    - "Az üvegzseb program célja, hogy a hivatal pénzügyei bárki számára átláthatók legyenek. Az üvegzseb kifogástalanul átlátszó, bár a zsebbe nem fér bele semmi."
kozerdeku-adatok/kozbeszerzesek:
  paragraphs:
    - "A közbeszerzések listája üres, mert a hivatal minden beszerzést a „valaki majd hoz” elve alapján intéz."
kozerdeku-adatok/szerzodesek:
  paragraphs:
    - "A hivatal szerződéseit kitalált partnerekkel köti. A szerződések szerint minden fél jóhiszemű, és mindenki egyetért abban, hogy egyetért."
kozerdeku-adatok/adatvedelem:
  paragraphs:
    - "A hivatal komolyan veszi az adatvédelmet: a lakosok adatait egy kulccsal zárt dobozban őrzi, a kulcsot pedig egy másik dobozban."
    - "Az oldal kitalált, és semmilyen valódi adatkezelésről nem tájékoztat."
magyar-falu-program:
  paragraphs:
    - "A Paprika Falu Program (paródia) a község fejlesztésére indított, kitalált kezdeményezés. Célja, hogy a falu még inkább olyan legyen, amilyennek a lakosok elképzelik."
    - "Az első szakasz a következőket tartalmazza: egy új pad, egy régi pad felújítása és egy harmadik pad átnevezése."
szlovak-nemzetisegi-onkormanyzat:
  paragraphs:
    - "A kitalált nemzetiségi önkormányzat a hagyományok ápolásával foglalkozik, különös tekintettel a közös nótázásra és a krumplis lángos sütésére."
    - "Az oldal paródia, valódi nemzetiségi szervezetet nem mutat be."
polgarmester-valasztas-eredmenyei:
  paragraphs:
    - "Kitalált oldal. A paródia világában a polgármestert egy hosszú, derűs vita után választották meg, amelyen mindenki pontosan ugyanazt mondta."
    - "Valódi választási eredményekről a hivatalos forrásokból tájékozódhat."
szlovak-nemzetisegi-onkormanyzat-valasztas-eredmenyei:
  paragraphs:
    - "Kitalált oldal, valódi eredményeket nem közöl. A paródia világában a választás egyetlen kérdése az volt, hogy ki süti a legjobb lángost, és a válasz „mindenki” volt."
tak:
  paragraphs:
    - "A TAK a Társulati Akasztófahumor Központ rövidítése. Feladata, hogy a hivatal nehéz napjain egy jól időzített viccel segítsen."
tak-es-a-tkr-egyeztetese:
  paragraphs:
    - "A TAK és a TKR egyeztetése a hivatal egyik legnagyobb sikertörténete: a két szervezet évek óta ugyanazt gondolja, csak más sorrendben."
valasztasi-informaciok:
  paragraphs:
    - "Ez az oldal kitalált. Valódi választási tudnivalókat nem tartalmaz, kizárólag a paródia szereplőire és körülményeire vonatkozik."
    - "Valódi választási információkért kérjük, keresse a hivatalos forrásokat."
valasztasi-informaciok/2024-evi-altalanos-valasztasok:
  paragraphs:
    - "A paródia világában a 2024. évi általános választások a kerti törpék választási kampányáról szóltak, de a törpék nem indultak, ezért a kampány eredménytelenül sikeres volt."
valasztasi-informaciok/2024-evi-altalanos-valasztasok/hatarozatok:
  paragraphs:
    - "A határozatok listája: 1/2024. Határozat arról, hogy a határozatokat meg kell számozni. 2/2024. Határozat arról, hogy az első határozatot meg kell erősíteni."
valasztasi-informaciok/2024-evi-altalanos-valasztasok/jeloltteknek:
  paragraphs:
    - "A jelölteknek szóló tájékoztató egyetlen mondat: legyen mindenki önmaga, de lehetőleg jól öltözötten."
valasztasi-informaciok/2024-evi-altalanos-valasztasok/valasztopolgaroknak:
  paragraphs:
    - "A választópolgároknak szóló tájékoztató kitalált. Az egyetlen kérés: ne higgyenek el mindent, amit egy paródia-oldalon olvasnak."
valasztasi-informaciok/2026-evi-orszaggyulesi-valasztasok:
  paragraphs:
    - "Ez az oldal szatirikus, és nem tartalmaz választási információt. A paródia-község lakói a választás napját egy közös paprikaszedéssel töltik, amely a hivatal szerint „demokratikusan fárasztó”."
    - "A valódi választásokkal kapcsolatos tudnivalókért kérjük, forduljon hivatalos forrásokhoz."
valasztasi-informaciok/korabbi-valasztasok:
  paragraphs:
    - "A korábbi választások archívumában minden választás szerepel, amelyről a hivatal azt hiszi, hogy megtörtént."
valasztasi-informaciok/valasztasi-szervek:
  paragraphs:
    - "A választási szervek a paródia világában ünnepélyes bizottságok, amelyek a szavazat nagyságát nem, de a hangulat minőségét komolyan mérik."
valasztasi-informaciok/valasztasi-szervek/a-valasztasi-bizottsag:
  paragraphs:
    - "A választási bizottság három tagja egyaránt nagyon komoly arcot vág. Az üléseken kötelező a csend, a végén pedig kötelező a taps."
valasztasi-informaciok/valasztasi-szervek/a-valasztasi-ioda:
  paragraphs:
    - "A választási ioda a hivatal földszintjén nyílik, ha éppen van mi. A nyitva tartás kitalált."
valasztasi-informaciok/valasztasi-ugyintezes:
  paragraphs:
    - "A választási ügyintézés a paródia-hivatalban egyetlen ablakon keresztül zajlik. Az ablak nem nyílik, de a szándék őszinte."
    - "Valódi választási ügyintézéshez kérjük, ne ezt az oldalt használja, hanem a hivatalos felületeket."
versenykepes-jarasok-program:
  paragraphs:
    - "A Versenyképes Járások Program célja, hogy a járás minden települése egymással is versenyezzen, lehetőleg barátságosan és időben."
falunkrol/paprikafesztival:
  paragraphs:
    - "Augusztusban több éve rendezik meg a mára hagyománnyá vált Paprikafesztivált. A program: paprika-szépségverseny, paprika-kvíz, paprika-nóta és a paprikák közötti nyílt vita."
    - "A fesztivál kitalált, helyszínét és időpontját nem hirdetjük, mert nincs."
falunkrol/testvertelepulesek:
  paragraphs:
    - "A község testvértelepülései: Paprikaháza (kitalált), Nagyjövőbeli és egy meg nem nevezett falu, amely a nevével sem akar bajlódni."
    - "A testvértelepülési kapcsolat lényege, hogy a lakosok évente egyszer köszönnek egymásnak egy távoli kerítésen át."
virtualis-seta:
  paragraphs:
    - "A virtuális séta során a látogató a monitor előtt ülve járhatja be a községet. A séta hossza megegyezik az olvasás hosszával, nehézsége pedig a görgetés nehézségével."
valasztasok:
  paragraphs:
    - "A Választások rovat kitalált, a paródia választási eseményeit gyűjti. Valódi választási információt nem tartalmaz."
valasztasok/hvb-hatarozatok-2019:
  paragraphs:
    - "A kitalált HVB határozatai között a legfontosabb az volt, hogy a szavazólapot ceruzával szabad kitölteni, de gondolatban is."
valasztasok/valasztasok-2019:
  paragraphs:
    - "A paródia világában a 2019-es választások a község történetének legcsendesebb eseményei voltak, a csendet mindössze a lapozás zaja törte meg."
onkormanyzat/dokumentumok:
  paragraphs:
    - "Dokumentumaink között megtalálhatók a kitalált kérelmek és tájékoztatók. A dokumentumok mind PDF-ben érhetők el, és mindegyiken megtalálható a „paródia” bélyegző."
  attachments:
    - title: "Tájékoztatás a nem létező kutak engedélyeztetéséről"
      file: /dokumentumok/tajekoztatas-kutak.pdf
    - title: "Kérelem kút képzeletbeli megszüntetéséhez"
      file: /dokumentumok/kerelem-kut-megszuntetes.pdf
onkormanyzat/e-ugyintezes:
  paragraphs:
    - "Az e-ügyintézés lényege, hogy az ügyfél otthonról is elindíthatja az ügyet, majd a hivatalban kell befejeznie. A rendszer kitalált, jelszót nem kér."
onkormanyzat/kepviselo-testulet:
  paragraphs:
    - "A képviselő-testület hét tagból áll: hat kitalált személyből és egy szék, amelyet nagy tisztelettel „a hetedik tagnak” neveznek."
onkormanyzat/kepviselo-testulet/vagyonnyilatkozatok:
  paragraphs:
    - "A vagyonnyilatkozatok egyetlen tételt tartalmaznak mindegyik képviselőtől: egy jó kedélyt, amely értéke megbecsülhetetlen."
onkormanyzat/rendeletek:
  paragraphs:
    - "A rendeletek mind kitaláltak. Egy példa: „A szomszéd falu iránti kölcsönös szimpátia szabályairól”."
  attachments:
    - title: "9/2025. (III.14.) önkormányzati rendelet"
      file: /dokumentumok/rendelet-9-2025.pdf
onkormanyzat/testuleti-ulesek:
  paragraphs:
    - "A testületi ülések nyilvánosak, de a székek száma korlátozott. Az ülések napirendje rendszerint három pontból áll: a megnyitóból, a vitából és a megnyitó megismétléséből."
civil-szervezetek:
  paragraphs:
    - "A községben a civil szervezetek szorgalmasan dolgoznak. Ilyen a Paprikabarátok Köre, a Hétfői Szökőkút Egyesület és a Nagy Kerti Törpék Védegylete."
intezmenyek/iskola-es-ovoda:
  paragraphs:
    - "A kitalált iskola és óvoda a paródia legkedvesebb intézménye: itt a gyerekek paprikarajzolást, hangos mondókázást és szabad kérdezést tanulnak."
    - "Ez az oldal nem ad tájékoztatást valódi intézményről, nyitva tartásról vagy tanítási rendről."
intezmenyek/konyha:
  paragraphs:
    - "A konyha főztje a hírek szerint „minden hétfőn ugyanolyan, mint kedden, csak kicsit meglepőbb”. A napi menü kitalált, de nagyon részletes."
intezmenyek/muvelodesi-haz:
  paragraphs:
    - "A művelődési ház a község kulturális szíve, amely hetente háromszor kinyit, kétszer bezár, és egyszer elgondolkodik. A Községi Könyvtár képzelt könyvállománya 10 ezer kötetet számlál."
intezmenyek/termalfurdo-es-camping:
  paragraphs:
    - "A kitalált termálfürdő vize ásványi anyagokban gazdag képzelet, jótékony hatása a hétfői rosszkedvre bizonyított. Gyógyhatásról nem esik szó."
    - "A mellette működő kitalált kemping egész évben várja a turistákat, akik a sátrukat szabadon felállíthatják egy fejben."
kozerdeku-info:
  paragraphs:
    - "A közérdekű információk között kizárólag olyan tájékoztatások szerepelnek, amelyek nem érdekelnek senkit, de kedvesek."
palyazatok:
  paragraphs:
    - "A hivatal pályázatai a kitalált források felhasználásával, kitalált célokra, kitalált eredményekkel zárulnak. Valódi pályázatról nem szól."
palyazatok/efop-1-5-3-16-2017-00062:
  paragraphs:
    - "A paródia-projekt célja, hogy a községben minden lakos legalább egyszer szívből, hangosan nevessen. A megvalósítás során a nevetés összesen 14-szer fordult elő."
palyazatok/efop-3-9-2-16-2017-00027:
  paragraphs:
    - "A projekt egy közösségi tér létrehozását tűzte ki célul. A tér megvalósult, de a bejárat még nincs meg."
top-palyazatok:
  paragraphs:
    - "A TOP Pályázatok a paródia legnagyobb fejlesztései, amelyek mind kitaláltak, de mind nagyon fényes tervekkel rendelkeznek."
top-palyazatok/top-plusz-2-1-1-21-bs1-2022-00027:
  paragraphs:
    - "A projekt keretében egy teljesen új, kitalált járdaszakasz épül. A járdaszakasz hossza 12 méter, szélessége pedig a hivatal szerint „éppen elegendő”."
top-palyazatok/top-plusz-2-1-1-21-bs1-2022-00026:
  paragraphs:
    - "A művelődési ház energetikai korszerűsítése nagyon sikeres volt: az épület ma már a fűtést is érzékeli, bár nem mindig vesz róla tudomást."
top-palyazatok/top-1-4-1-15-bs1-2016-00043:
  paragraphs:
    - "Egy kitalált bölcsőde-fejlesztés, amelynek lényege egy új, kitalált lépcső. A lépcső tizennyolc fokú, de a fokok nem mind használhatók."
top-palyazatok/top-1-1-3-15-bs1-2016-00028:
  paragraphs:
    - "A projekt célja a gazdasági élet fellendítése volt. Az élet fellendült, majd visszatért."
top-palyazatok/top-4-1-1-15-bs1-2016-00023:
  paragraphs:
    - "Az egészségügyi alapellátás fejlesztése című kitalált projekt nem tartalmaz egészségügyi információt. A projekt lényege egy új, kitalált váróterem, ahol a várakozás kellemes, de eredménytelen."
kozbeszerzesek:
  paragraphs:
    - "A közbeszerzések rovat a hivatal kitalált beszerzési eljárásait tartalmazza. Minden eljárás nyílt, átlátható és kissé hosszú."
kozbeszerzesek/iskola-felujitasa:
  paragraphs:
    - "A kitalált iskola felújítása során a kivitelező minden tantermet megfestett, a falak viszont úgy döntöttek, hogy maradnak, ahogy vannak."
kozbeszerzesek/orvosi-rendelo-fejlesztese:
  paragraphs:
    - "A paródia-rendelő infrastrukturális fejlesztése kizárólag a váróterem székeit és egy új növényt érint. Az oldal nem ad egészségügyi tájékoztatást."
kerdoivek:
  paragraphs:
    - "A kérdőívek célja, hogy a lakosok véleményét megismerjük. Az egyetlen kérdés: „Szereti-e a paprikát?”. Az eredmény egyelőre egyhangú."
